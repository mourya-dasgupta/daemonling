name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Test (coverage gate — core must stay >= 90%)
        run: pnpm test
      - run: pnpm build
      - name: Smoke test the dmn binary
        run: |
          export DAEMONLING_HOME="$(mktemp -d)"
          node apps/cli/dist/dmn.js --help
          node apps/cli/dist/dmn.js init --name CI
          node apps/cli/dist/dmn.js start 1 --test-duration-ms 100
          node apps/cli/dist/dmn.js status
          node apps/cli/dist/dmn.js prompt
      - name: Package VS Code extension
        run: pnpm --filter daemonling-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: daemonling-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
